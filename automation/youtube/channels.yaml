# 감시 대상 YouTube 채널
#
# 새 채널을 추가할 때 Python 코드는 건드리지 않는다. 이 파일만 고치면 된다.
# 이 파일은 스크립트가 다시 쓰지 않는다(주석·서식 보존).
# 해석된 channel_id 캐시는 state/resolved_channels.json 에 별도 저장된다.

defaults:
  # transcript 타임스탬프 표기
  #   line   — 타임스탬프를 별도 행으로 (기본. 기존 raw 28건과 동일한 형태)
  #   prefix — 각 행 앞에 [M:SS]
  #   none   — 제거
  timestamp_style: line

  # 이 길이 미만 영상은 건너뛴다 (Shorts 배제). 0 = 제한 없음
  min_duration_sec: 120

channels:
  - name: 세무법인다솔
    # url 은 아래 형태 모두 지원한다:
    #   https://www.youtube.com/@handle
    #   https://www.youtube.com/channel/UCxxxxxxxxxxxxxxxxxxxxxx
    #   https://www.youtube.com/c/CustomName
    # 채널명 '다솔세무TV'. 기존 raw 28건이 이 채널 영상임을 제목 대조로 확인했다.
    url: "https://www.youtube.com/channel/UC3VsUfQ8gbdVgJ2Ernv-vvg"
    category: 세무자문

    # 수집한 transcript를 저장할 경로 (저장소 루트 기준).
    # ★ 기존 수동 수집 컬렉션에 이어서 누적한다 — 새 폴더를 만들지 않는다.
    #   (이 폴더의 기존 .txt 28건과 동일한 지식 컬렉션이며,
    #    wiki/sources/세무법인다솔 유튜브 스터디/ 와 1:1 대응한다)
    raw_dir: "raw/유튜브 스터디/세무법인다솔 유튜브 스터디"

    # ⚠️ 채널 전체 감시를 하지 않는다 (2026-08-21 사용자 지시).
    # 이 채널은 필요한 영상·재생목록만 골라서 받는다. 신규 영상 자동 수집 대상이 아니다.
    #   enabled: false 는 youtube_watcher.py 의 감시에서만 제외한다.
    #   playlist_fetch.py 는 enabled 를 보지 않으므로 아래처럼 그대로 쓸 수 있다:
    #     python automation/youtube/playlist_fetch.py --channel "세무법인다솔" --playlist-url "URL"
    enabled: false

  - name: 로뎀세무법인
    url: "https://www.youtube.com/@rodemtax"
    category: 세무자문

    # 신규 채널 — 자체 컬렉션 폴더로 시작한다.
    raw_dir: "raw/유튜브 스터디/로뎀세무법인 유튜브 스터디"

    enabled: true

  - name: 세금전문회계사김희연
    url: "https://www.youtube.com/@세금전문회계사김희연"
    category: 세무자문

    # 신규 채널 — 자체 컬렉션 폴더로 시작한다.
    raw_dir: "raw/유튜브 스터디/세금전문회계사 김희연 유튜브 스터디"

    # 제목 기준 제외 (2026-11-13 사용자 지시: 재테크·브이로그·연금 영상은 받지 않는다).
    # 자막을 받기 전에 제목만 보고 판정하고, ledger에 status=skipped 로 남겨 다시 받지 않는다.
    #   exclude             : 하나라도 들어 있으면 무조건 제외
    #   exclude_unless_keep : 들어 있으면 제외하되, keep_if 낱말이 함께 있으면 받는다
    #   keep_if             : 세무 주제임을 보여 주는 낱말 ('절세미녀'는 모든 제목에 붙으므로 '절세'는 넣지 않는다)
    title_filter:
      exclude: [브이로그, vlog, 일상, 다이어트, 연금]
      exclude_unless_keep: [재테크, 주식, ETF, "S&P", 배당, 포트폴리오, 투자, 자산, 부자, 노후, 은퇴, 무주택, 퇴직금, 돈 버는, 돈버는, 돈 벌, 돈 복사, 돈의 공식, 레버리지, 집값, 금리, 대출]
      keep_if: [세금, 상속, 증여, 양도, 세무, 부가세, 종소세, 종합소득, 법인세, 국세청, 신고, 취득세, 종부세, 보유세, 과세]

    enabled: true

  - name: 상속마스터 정변
    # 채널명 '상속마스터 정변'(법무법인 시완 정재완 변호사). 상속전문 변호사 채널.
    url: "https://www.youtube.com/@chung_lawyer"
    category: 법률

    # 신규 채널 — 자체 컬렉션 폴더로 시작한다.
    raw_dir: "raw/유튜브 스터디/상속마스터 정변 유튜브 스터디"

    enabled: true

  - name: 택스인사이드
    # 채널명 '택스인사이드'(이정근 세무사). 부동산세제·상속증여·양도세 중심.
    url: "https://www.youtube.com/channel/UCWhpZsI4Zy8NkSKSgREF-3g"
    category: 세무자문

    # 신규 채널 — 자체 컬렉션 폴더로 시작한다.
    raw_dir: "raw/유튜브 스터디/택스인사이드 유튜브 스터디"

    enabled: true

  # 예시 — 새 채널은 이렇게 추가한다 (자체 컬렉션 폴더를 갖는다)
  # - name: example-channel
  #   url: "https://www.youtube.com/@example"
  #   category: 재무자문
  #   raw_dir: "raw/유튜브 스터디/example-channel 유튜브 스터디"
  #   enabled: false

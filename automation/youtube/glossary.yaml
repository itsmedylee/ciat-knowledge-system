      ⚠️ 단독 `2월`은 정상어(달 이름)이므로 절대 규칙화하지 않는다. 이 구(句) 전체로만 치환한다.
      같은 영상의 "2월이 안 돼요"·"2월에서 쓸 수 있는" 도 이월이지만 구가 달라 자동 치환 대상이 아니다 → review 참조.

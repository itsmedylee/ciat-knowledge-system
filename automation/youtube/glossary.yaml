# ─────────────────────────────────────────────────────────────
# review — 오인식으로 의심되나 자동 치환 금지. ingest 시 사람이 문맥 판단한다.
# ─────────────────────────────────────────────────────────────
review:
  - term: 세입공제
    candidates: [세액공제]
    note: 1건. 문맥만으로 확정 못 함 → [원문 확인 필요] 표기 후 판단

  - term: 부가가실세·부가가 실세·부가 가시세
    candidates: [부가가치세]
    note: |
      "부가세"의 완전한 형태인 "부가가치세"가 자동자막에서 여러 방식으로 깨진다
      (로뎀세무법인 채널 2026-08-24 영상에서 3종 변형 확인). 위 `부과세→부가세` confirmed 항목과
      달리 이쪽은 깨지는 패턴이 영상마다 달라(공백 위치·음절 대체) 규칙화하지 않는다.
      ingest 시 문맥상 명백히 "부가가치세"이면 그대로 교정 표기하되, review로 남겨 다음
      영상에서 같은 패턴이 반복되면 confirmed로 승격한다.

  - term: 디자인텍스
    candidates: [디자인택스]
    note: |
      채널 운영 회계사의 회사(세무·회계 사무소)명. 코퍼스 표기가 갈린다.
        텍 계열 ~50건 (디자인텍스·디자인 텍스·디자인덱스 …)
        택 계열   3건 (디자인 택스는·디자인 택스의)
      빈도만 보면 텍이지만 자동자막 빈도는 정답 근거가 되지 못한다(다수결이 아니라 ASR 편향).
      tax 음차라면 택스가 맞다. 코퍼스로는 확정 불가 → 외부 확인 전까지 임의 교정 금지.
      wiki 본문에 회사명을 쓸 일이 생기면 그때 공식 표기를 확인하고 이 항목을 confirmed로 옮긴다.
      ※ 현재 [[김희연]] entity 페이지는 회사명을 기록하지 않는다. 무리해서 넣지 않는다.

  - term: 2월 (단독)
    candidates: [이월]
    note: |
      기부금 이월공제 문맥에서 "이월"이 "2월"로 흘러나온다("2월이 안 돼요"·"2월에서 쓸 수 있는",
      김희연 2026-09-11 정당 후원금 편). `2월 공제` 라는 구는 confirmed로 올렸지만,
      단독 `2월`은 달 이름과 충돌하므로 자동 치환하지 않는다. ingest 시 문맥으로 판단한다.

# ─────────────────────────────────────────────────────────────
# never — 오탐으로 판정된 것. 다시 후보로 올리지 않는다.
# ─────────────────────────────────────────────────────────────
never:
  - term: 인텍스
    reason: 회사명 `디자인텍스`의 부분 문자열. 독립 오인식이 아니다.
  - term: 사대보험
    reason: 구어 표기이지 오인식이 아니다. wiki 문서에는 `4대보험`으로 쓰되 raw 오류로 취급하지 않는다.
  - term: 부지연가산세
    reason: |
      `납부지연가산세`(정상어)의 부분 문자열. 검출 정규식이 앞 3글자만 잡아 생긴 절단 artifact다.
      confirmed에 넣으면 정상어를 `납납부지연가산세`로 망가뜨린다.

  - term: 축의
    reason: |
      `추계`의 오인식으로 보이지만 2건 중 1건이 **`종합저축의`**(종합저축+조사 '의')다.
      치환하면 정상어를 `종합추계` 로 망가뜨린다. 나머지 1건은 문맥으로 판단한다.

  - term: 김문수
    reason: |
      실존 별개 인물(정치인). 「이재명 vs 김문수 세금 공약 비교」 영상에 7건 등장한다.
      화자명 `김희연` 오인식으로 오해해 치환하면 전혀 다른 사람으로 바꿔버린다.

  - term: 화자명·회사명 인트로/아웃트로 변형
    reason: |
      화자명은 `김희연`(214건) 대 잡음 꼬리 수십 종(김현회·김혜원·김현우·김여원·김현욱·김희원…),
      회사명도 20여 종으로 흩어져 있다. 규칙화하면 사전만 비대해지고 오탐 위험이 커진다.
      게다가 이 변형은 전부 인사말·홍보 상용구에 있어 **위키 본문에 옮겨 적을 내용이 아니다.**
      → 사전 대상에서 제외한다. 화자 식별은 [[김희연]] entity 페이지가 이미 다루고 있다.

# ─────────────────────────────────────────────────────────────
# 검출 방법 메모 — 다음 채널·코퍼스에 재사용할 것
# ─────────────────────────────────────────────────────────────
_method: |
  효과 있었던 방법: 고유명사·제도명의 음차/표기 변형 축으로 정규식을 쓸어
  「고빈도 정답형 + 저빈도 꼬리」를 대조한다. 꼬리가 오인식 후보다.
  예: r'[가-힣]?[텍택]스' → 홈택스(71) 대 홈텍스(8)·홍택스(1)

  효과 없었던 방법: wiki 어휘 대비 편집거리 1 근사매칭. 한글 활용형 때문에
  후보 5694종이 나오고 상위 45종 전부 오탐이었다. 쓰지 말 것.

  원리적 한계: 세율·공제한도 금액·법령명·인명은 사전으로 검출 불가능하다.
  ("40%"를 "14%"로 오인식해도 사전은 못 잡는다.)
  이 축은 반드시 ingest 시 원문 대조 + [원문 확인 필요] 표기로 처리한다.
